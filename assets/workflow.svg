<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" role="img" aria-labelledby="title desc">
  <title id="title">Result Analysis workflow</title>
  <desc id="desc">A student enters information, the browser stores the data, JavaScript calculates the result, and the report can be printed.</desc>
  <defs>
    <linearGradient id="g" x1="0" x2="1"><stop stop-color="#0f766e"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity=".12"/></filter>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#64748b"/></marker>
  </defs>
  <rect width="1000" height="260" rx="22" fill="#f8fafc"/>
  <g font-family="Inter,Arial,sans-serif" text-anchor="middle">
    <g filter="url(#s)">
      <rect x="28" y="65" width="200" height="118" rx="16" fill="#fff" stroke="#cbd5e1"/>
      <rect x="278" y="65" width="200" height="118" rx="16" fill="#fff" stroke="#cbd5e1"/>
      <rect x="528" y="65" width="200" height="118" rx="16" fill="#fff" stroke="#cbd5e1"/>
      <rect x="778" y="65" width="194" height="118" rx="16" fill="#fff" stroke="#cbd5e1"/>
    </g>
    <g fill="url(#g)"><circle cx="58" cy="95" r="15"/><circle cx="308" cy="95" r="15"/><circle cx="558" cy="95" r="15"/><circle cx="808" cy="95" r="15"/></g>
    <g fill="#fff" font-size="13" font-weight="700"><text x="58" y="100">1</text><text x="308" y="100">2</text><text x="558" y="100">3</text><text x="808" y="100">4</text></g>
    <g fill="#0f172a" font-size="16" font-weight="700"><text x="128" y="130">Enter marks</text><text x="378" y="130">Store locally</text><text x="628" y="130">Analyse results</text><text x="875" y="130">View &amp; print</text></g>
    <g fill="#64748b" font-size="11"><text x="128" y="151">Student form</text><text x="378" y="151">Browser storage</text><text x="628" y="151">Best-of-Five logic</text><text x="875" y="151">Result report</text></g>
    <g stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#a)"><path d="M232 124H267"/><path d="M482 124H517"/><path d="M732 124H767"/></g>
    <text x="500" y="225" fill="#64748b" font-size="12">A simple client-side workflow — no backend or database in the current version</text>
  </g>
  <style>@media (prefers-reduced-motion:no-preference){g[filter="url(#s)"] rect{animation:rise .8s ease both}g[filter="url(#s)"] rect:nth-child(2){animation-delay:.1s}g[filter="url(#s)"] rect:nth-child(3){animation-delay:.2s}g[filter="url(#s)"] rect:nth-child(4){animation-delay:.3s}@keyframes rise{from{opacity:.4;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}</style>
</svg>